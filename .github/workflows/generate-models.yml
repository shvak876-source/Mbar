name: Generate model photos

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many photos to process (0 = all)"
        default: "3"
      model:
        description: "Gemini image model"
        default: "gemini-2.5-flash-image"

permissions:
  contents: write

concurrency: generate-models

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python tools/generate_models.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IMAGE_MODEL: ${{ inputs.model }}
          LIMIT: ${{ inputs.limit }}
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models
          git diff --cached --quiet && exit 0
          git commit -m "Add generated model photos"
          git push
